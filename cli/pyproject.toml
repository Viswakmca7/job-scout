[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vjobs-cli"
version = "1.0.0"
description = "Search Vjobs job listings from the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
vjobs = "vjobs.cli:main"

[tool.setuptools.packages.find]
include = ["vjobs*"]

databases:
  - name: vjobs-db
    plan: free
    databaseName: vjobs
    user: vjobs

services:
  - type: web
    name: job-scout
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VJOBS_CACHE_TTL
        value: 900
      - key: DATABASE_URL
        fromDatabase:
          name: vjobs-db
          property: connectionString
      - key: VJOBS_APP_BASE_URL
        value: https://job-scout-726z.onrender.com
      # Required for magic-link sign-up emails to actually send — set in the Render
      # dashboard, not here (it's a secret): SENDGRID_API_KEY, SENDGRID_FROM_EMAIL
      # (must be a single-sender address you've verified in SendGrid).
      # Optional — set these in the Render dashboard, not here, if you want them:
      # - key: ADZUNA_APP_ID
      # - key: ADZUNA_APP_KEY
      # - key: VJOBS_AFFILIATES
      # - key: VJOBS_GREENHOUSE_BOARDS
      # - key: VJOBS_LEVER_BOARDS

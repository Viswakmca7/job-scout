services:
  - type: web
    name: job-scout
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JOBSCOUT_CACHE_TTL
        value: 900
      # Optional — set these in the Render dashboard, not here, if you want them:
      # - key: ADZUNA_APP_ID
      # - key: ADZUNA_APP_KEY
      # - key: JOBSCOUT_AFFILIATES
